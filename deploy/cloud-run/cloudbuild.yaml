steps:
  - name: gcr.io/cloud-builders/docker
    env: ['DOCKER_BUILDKIT=1']
    args: ['build', '-f', 'deploy/cloud-run/Dockerfile', '-t', '${_IMAGE}', '.']
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint=sh
      - -v
      - /workspace:/workspace
      - -w
      - /workspace
      - '${_IMAGE}'
      - -c
      - >-
        python -m pip install --quiet pytest nbformat &&
        python -m pytest -p no:cacheprovider tests deploy/cloud-run/tests -q && cd /tmp &&
        python -c "import torch; from transformers import Sam3Model, Sam3Processor; assert torch.version.cuda; from automage.config import Config, model_sha; model_sha(Config.model); Sam3Processor.from_pretrained(Config.model, local_files_only=True)"
images: ['${_IMAGE}']
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY
